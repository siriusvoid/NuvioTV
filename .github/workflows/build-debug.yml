name: Build Debug APK
run-name: ${{ github.event.head_commit.message || github.ref_name }}
on:
  push:
    branches: [ '**' ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Restore debug keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_B64 }}" | base64 --decode \
            > ~/.android/debug.keystore
      - name: Build debug APK
        env:
          INTRODB_API_URL: ${{ secrets.INTRODB_API_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: ./gradlew assemblePlaystoreDebug
      - name: Sign APK with debug keystore
        run: |
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -1)/apksigner sign \
            --ks ~/.android/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out app/build/outputs/apk/playstore/debug/app-signed-debug.apk \
            app/build/outputs/apk/playstore/debug/app-playstore-armeabi-v7a-debug-unsigned.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/playstore/debug/app-signed-debug.apk