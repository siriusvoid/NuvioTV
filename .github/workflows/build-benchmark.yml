name: Build Benchmark APK
run-name: ${{ github.event.head_commit.message || github.ref_name }}
on:
  push:
    branches: [ 'test/main' ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Prepare local properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
          LOCAL_DEV_PROPERTIES_BASE64: ${{ secrets.LOCAL_DEV_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          fi
          if [ -n "$LOCAL_DEV_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_DEV_PROPERTIES_BASE64" | base64 --decode > local.dev.properties
          fi
      - name: Restore shared debug keystore
        run: |
          if [ -z "${{ secrets.DEBUG_KEYSTORE_B64 }}" ]; then
            echo "::error::DEBUG_KEYSTORE_B64 secret is not set; benchmark APKs would be signed with a random key and fail to install over previous builds."
            exit 1
          fi
          echo "${{ secrets.DEBUG_KEYSTORE_B64 }}" | base64 --decode \
            > "${{ runner.temp }}/debug.keystore"
      - name: Diagnose TMDB key resolution (masked)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -n "$TMDB_API_KEY" ]; then
            echo "env TMDB_API_KEY secret: present (length=${#TMDB_API_KEY})"
          else
            echo "env TMDB_API_KEY secret: EMPTY/unset"
          fi
          if [ -f local.properties ]; then
            if grep -q '^[[:space:]]*TMDB_API_KEY[[:space:]]*=' local.properties; then
              v=$(grep '^[[:space:]]*TMDB_API_KEY[[:space:]]*=' local.properties | head -1 | cut -d= -f2-)
              if [ -n "$v" ]; then
                echo "local.properties TMDB_API_KEY: present (length=${#v}) — local.properties wins"
              else
                echo "local.properties TMDB_API_KEY: BLANK — would shadow env on old gradle; fixed gradle now falls back to env"
              fi
            else
              echo "local.properties: no TMDB_API_KEY line (env secret will be used)"
            fi
          else
            echo "local.properties: not present (env secret will be used)"
          fi
      - name: Build benchmark APK (release-like, debug-signed)
        env:
          INTRODB_API_URL: ${{ secrets.INTRODB_API_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          DEBUG_KEYSTORE_FILE: ${{ runner.temp }}/debug.keystore
        run: ./gradlew assemblePlaystoreBenchmark
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: app-benchmark
          path: app/build/outputs/apk/playstore/benchmark/*.apk
          if-no-files-found: error
