name: Release (Full APK)
run-name: ${{ github.event.head_commit.message || github.ref_name }}

# Builds the FULL flavor (in-app updater enabled) as release-like, debug-signed
# APKs and publishes them as a GitHub Release. The in-app updater on test/main
# reads releases/latest from this repo, picks the ABI-matching APK, and installs
# it — so the APKs here must be signed with the SAME shared debug keystore
# (DEBUG_KEYSTORE_B64) as every other build users install, or the update is
# rejected for a signature mismatch.
#
# Reuses the same secrets as build-benchmark.yml; no extra secrets needed.
#
# Every push to test/main cuts a release — there is no version gate. versionName /
# versionCode still come from app/build.gradle.kts, but the release tag appends the
# workflow run number (e.g. 0.7.13-beta-42) so each build is unique and compares as
# strictly newer than the last for the in-app updater. You can also trigger manually
# via workflow_dispatch. gh creates the per-release tag automatically, so no tag
# pushing is needed.

on:
  push:
    branches:
      - test/main
  workflow_dispatch:
    inputs:
      notes:
        description: "Optional release notes (Markdown). Overrides the auto-generated changelog."
        required: false
        type: string
      prerelease:
        description: "Mark as a GitHub pre-release. NOTE: the in-app updater IGNORES pre-releases, so leave false to make it visible to the app."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Read version from source
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME=$(grep -E '^\s*versionName = ' app/build.gradle.kts | head -1 | sed -E 's/.*versionName = "([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E '^\s*versionCode = ' app/build.gradle.kts | head -1 | sed -E 's/.*versionCode = ([0-9]+).*/\1/')
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "::error::Could not parse versionName/versionCode from app/build.gradle.kts"
            exit 1
          fi
          # Every push cuts its own release, so the tag carries the run number.
          # The trailing number keeps each build strictly newer than the last for
          # the in-app updater's version comparison.
          RELEASE_TAG="${VERSION_NAME}-${GITHUB_RUN_NUMBER}"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Will build and release $RELEASE_TAG (versionName=$VERSION_NAME versionCode=$VERSION_CODE)"

      - name: Prepare local properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
          LOCAL_DEV_PROPERTIES_BASE64: ${{ secrets.LOCAL_DEV_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          fi
          if [ -n "$LOCAL_DEV_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_DEV_PROPERTIES_BASE64" | base64 --decode > local.dev.properties
          fi

      - name: Restore shared debug keystore
        run: |
          if [ -z "${{ secrets.DEBUG_KEYSTORE_B64 }}" ]; then
            echo "::error::DEBUG_KEYSTORE_B64 secret is not set; release APKs would be signed with a random key and fail to install over previous builds."
            exit 1
          fi
          echo "${{ secrets.DEBUG_KEYSTORE_B64 }}" | base64 --decode > "${{ runner.temp }}/debug.keystore"

      - name: Build full benchmark APKs (release-like, debug-signed)
        env:
          INTRODB_API_URL: ${{ secrets.INTRODB_API_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          DEBUG_KEYSTORE_FILE: ${{ runner.temp }}/debug.keystore
        run: ./gradlew assembleFullBenchmark

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.ver.outputs.version_name }}
          VERSION_CODE: ${{ steps.ver.outputs.version_code }}
          RELEASE_TAG: ${{ steps.ver.outputs.release_tag }}
          NOTES: ${{ inputs.notes }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [ -z "$NOTES" ]; then
            # Notes = upstream NuvioMedia's release notes for this version (the
            # fork shares its version/tag scheme), plus this fork's own new
            # feat/fix commits (excluding anything already in upstream dev and
            # earlier releases). Falls back to the fork changelog, then generic.
            UPSTREAM_NOTES=$(gh release view "$VERSION_NAME" --repo NuvioMedia/NuvioTV --json body --jq .body 2>/dev/null || true)

            git fetch --tags --force --depth=200 origin >/dev/null 2>&1 || true
            git fetch --no-tags --depth=200 origin +refs/heads/dev:refs/remotes/origin/dev >/dev/null 2>&1 || true
            EXCLUDES=""
            PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
            [ -n "$PREV" ] && EXCLUDES="$EXCLUDES ^$PREV"
            git rev-parse --verify -q origin/dev >/dev/null 2>&1 && EXCLUDES="$EXCLUDES ^origin/dev"
            FORK_CHANGES=""
            if [ -n "$EXCLUDES" ]; then
              FORK_CHANGES=$(git log -E --grep='^(feat|fix)(\(.+\))?:' --pretty='- %s' HEAD $EXCLUDES \
                | grep -viE 'in-app updater at fork releases' || true)
            fi

            if [ -n "$UPSTREAM_NOTES" ]; then
              if [ -n "$FORK_CHANGES" ]; then
                NOTES=$(printf '%s\n\n### This fork also adds\n%s' "$UPSTREAM_NOTES" "$FORK_CHANGES")
              else
                NOTES="$UPSTREAM_NOTES"
              fi
            elif [ -n "$FORK_CHANGES" ]; then
              NOTES=$(printf 'In-app update build — versionName %s (versionCode %s).\n\n### Changes\n%s' "$VERSION_NAME" "$VERSION_CODE" "$FORK_CHANGES")
            else
              NOTES="In-app update build — versionName ${VERSION_NAME} (versionCode ${VERSION_CODE})."
            fi
          fi
          ARGS=(release create "$RELEASE_TAG" --title "NuvioTV ${RELEASE_TAG}" --notes "$NOTES")
          if [ "$PRERELEASE" = "true" ]; then
            ARGS+=(--prerelease)
          fi
          shopt -s nullglob
          APKS=(app/build/outputs/apk/full/benchmark/*.apk)
          if [ ${#APKS[@]} -eq 0 ]; then
            echo "::error::No APKs found in app/build/outputs/apk/full/benchmark/"
            exit 1
          fi
          gh "${ARGS[@]}" "${APKS[@]}"

      # Every push cuts a release and the in-app updater only ever reads
      # releases/latest, so everything older is deleted along with the orphaned
      # tags a rebase leaves behind.
      - name: Prune old releases
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: 1
        run: |
          gh release list --limit 200 --json tagName,createdAt \
            --jq "sort_by(.createdAt) | reverse | .[${KEEP}:] | .[].tagName" > stale-tags.txt
          if [ ! -s stale-tags.txt ]; then
            echo "Nothing to prune."
            exit 0
          fi
          while read -r tag; do
            [ -n "$tag" ] || continue
            echo "Deleting old release $tag"
            gh release delete "$tag" --yes --cleanup-tag || echo "::warning::Could not delete release $tag"
          done < stale-tags.txt
