name: Release (Full APK)
run-name: Release (from build.gradle.kts)

# Builds the FULL flavor (in-app updater enabled) as release-like, debug-signed
# APKs and publishes them as a GitHub Release. The in-app updater on test/main
# reads releases/latest from this repo, picks the ABI-matching APK, and installs
# it — so the APKs here must be signed with the SAME shared debug keystore
# (DEBUG_KEYSTORE_B64) as every other build users install, or the update is
# rejected for a signature mismatch.
#
# Reuses the same secrets as build-benchmark.yml; no extra secrets needed.
#
# Version is the SINGLE SOURCE OF TRUTH in app/build.gradle.kts (versionName /
# versionCode). A release auto-publishes whenever a push to test/main changes
# build.gradle.kts to a version that has no release yet — so bumping the version
# (including an upstream sync that bumps it) cuts a release automatically. If a
# release for the current versionName already exists, the run skips (no rebuild).
# You can also trigger manually via workflow_dispatch. gh creates the per-release
# tag automatically, so no tag pushing is needed.

on:
  push:
    branches:
      - test/main
    paths:
      - 'app/build.gradle.kts'
  workflow_dispatch:
    inputs:
      notes:
        description: "Optional release notes (Markdown). Overrides the auto-generated changelog."
        required: false
        type: string
      prerelease:
        description: "Mark as a GitHub pre-release. NOTE: the in-app updater IGNORES pre-releases, so leave false to make it visible to the app."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Read version from source
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME=$(grep -E '^\s*versionName = ' app/build.gradle.kts | head -1 | sed -E 's/.*versionName = "([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E '^\s*versionCode = ' app/build.gradle.kts | head -1 | sed -E 's/.*versionCode = ([0-9]+).*/\1/')
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "::error::Could not parse versionName/versionCode from app/build.gradle.kts"
            exit 1
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          if gh release view "$VERSION_NAME" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Release $VERSION_NAME already exists — nothing to do. Bump versionName/versionCode in app/build.gradle.kts to cut a new one."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Will build and release versionName=$VERSION_NAME versionCode=$VERSION_CODE"
          fi

      - name: Prepare local properties
        if: ${{ steps.ver.outputs.should_release == 'true' }}
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
          LOCAL_DEV_PROPERTIES_BASE64: ${{ secrets.LOCAL_DEV_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          fi
          if [ -n "$LOCAL_DEV_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_DEV_PROPERTIES_BASE64" | base64 --decode > local.dev.properties
          fi

      - name: Restore shared debug keystore
        if: ${{ steps.ver.outputs.should_release == 'true' }}
        run: |
          if [ -z "${{ secrets.DEBUG_KEYSTORE_B64 }}" ]; then
            echo "::error::DEBUG_KEYSTORE_B64 secret is not set; release APKs would be signed with a random key and fail to install over previous builds."
            exit 1
          fi
          echo "${{ secrets.DEBUG_KEYSTORE_B64 }}" | base64 --decode > "${{ runner.temp }}/debug.keystore"

      - name: Build full benchmark APKs (release-like, debug-signed)
        if: ${{ steps.ver.outputs.should_release == 'true' }}
        env:
          INTRODB_API_URL: ${{ secrets.INTRODB_API_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          DEBUG_KEYSTORE_FILE: ${{ runner.temp }}/debug.keystore
        run: ./gradlew assembleFullBenchmark

      - name: Create GitHub Release
        if: ${{ steps.ver.outputs.should_release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.ver.outputs.version_name }}
          VERSION_CODE: ${{ steps.ver.outputs.version_code }}
          NOTES: ${{ inputs.notes }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [ -z "$NOTES" ]; then
            # Notes = upstream NuvioMedia's release notes for this version (the
            # fork shares its version/tag scheme), plus this fork's own feat
            # commits (excluding anything already in upstream dev and earlier
            # releases). Falls back to the fork changelog, then generic.
            UPSTREAM_NOTES=$(gh release view "$VERSION_NAME" --repo NuvioMedia/NuvioTV --json body --jq .body 2>/dev/null || true)

            git fetch --tags --force --depth=200 origin >/dev/null 2>&1 || true
            git fetch --no-tags --depth=200 origin +refs/heads/dev:refs/remotes/origin/dev >/dev/null 2>&1 || true
            EXCLUDES=""
            PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
            [ -n "$PREV" ] && EXCLUDES="$EXCLUDES ^$PREV"
            git rev-parse --verify -q origin/dev >/dev/null 2>&1 && EXCLUDES="$EXCLUDES ^origin/dev"
            # First parent only: upstream arrives through merges into test/main, and the fork's dev
            # isn't kept in step, so anything newer than dev would otherwise be listed as the fork's.
            FORK_CHANGES=""
            if [ -n "$EXCLUDES" ]; then
              FORK_CHANGES=$(git log --first-parent -E --grep='^feat(\(.+\))?:' --pretty='%s' HEAD $EXCLUDES \
                | grep -viE 'in-app updater at fork releases' \
                | sed -E 's/^feat(\([^)]*\))?: *//' \
                | awk '{ print "- " toupper(substr($0, 1, 1)) substr($0, 2) }' || true)
            fi

            if [ -n "$UPSTREAM_NOTES" ]; then
              if [ -n "$FORK_CHANGES" ]; then
                NOTES=$(printf '%s\n\n### Fork Enhancements\n%s' "$UPSTREAM_NOTES" "$FORK_CHANGES")
              else
                NOTES="$UPSTREAM_NOTES"
              fi
            elif [ -n "$FORK_CHANGES" ]; then
              NOTES=$(printf 'In-app update build — versionName %s (versionCode %s).\n\n### Fork Enhancements\n%s' "$VERSION_NAME" "$VERSION_CODE" "$FORK_CHANGES")
            else
              NOTES="In-app update build — versionName ${VERSION_NAME} (versionCode ${VERSION_CODE})."
            fi
          fi
          ARGS=(release create "$VERSION_NAME" --title "NuvioTV ${VERSION_NAME}" --notes "$NOTES")
          if [ "$PRERELEASE" = "true" ]; then
            ARGS+=(--prerelease)
          fi
          shopt -s nullglob
          APKS=(app/build/outputs/apk/full/benchmark/*.apk)
          if [ ${#APKS[@]} -eq 0 ]; then
            echo "::error::No APKs found in app/build/outputs/apk/full/benchmark/"
            exit 1
          fi
          gh "${ARGS[@]}" "${APKS[@]}"
